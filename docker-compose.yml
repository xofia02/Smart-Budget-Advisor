services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbudget-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbudget
      POSTGRES_USER: smartbudget
      POSTGRES_PASSWORD: smartbudget
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - smartbudget-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbudget -d smartbudget"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: smartbudget-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Lê a chave do Gemini e as demais variáveis do backend/.env (se existir)
    env_file:
      - path: ./backend/.env
        required: false
    # Dentro do Docker o banco é acessado pelo nome do serviço, não por localhost
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/smartbudget
      DB_USER: smartbudget
      DB_PASSWORD: smartbudget
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: smartbudget-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  smartbudget-data:
